services:
  db:
    image: mysql:9.7.2
    env_file: ./.env
    environment:
      - MYSQL_ROOT_PASSWORD=$DB_ROOT_PASSWORD
      - MYSQL_DATABASE=$DB_NAME
    ports:
      - $DB_LOCAL_PORT:$DB_DOCKER_PORT
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: .
    env_file: ./.env
    environment:
      - DB_HOST=db
      - DB_PORT=$DB_DOCKER_PORT
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - .:/app
volumes:
  db_data: