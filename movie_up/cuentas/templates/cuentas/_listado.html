<h1>Cuentas</h1>

{% if error %}
<div class="error-message" role="alert">{{ error }}</div>
{% endif %}

<table class="data-table">
  <thead>
    <tr>
      <th>Correo</th>
      <th>Nombre</th>
      <th>Permisos</th>
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody>
    {% for cuenta in cuentas %}
    <tr>
      <td>{{ cuenta.correo }}</td>
      <td>{{ cuenta.nombre }}</td>
      <td>{% if cuenta.is_staff %}Administrador{% else %}Usuario común{% endif %}</td>
      <td>
        <form method="post" action="{% url 'cuentas:cuenta_permiso_update' cuenta.pk %}"
              data-panel-form>
          {% csrf_token %}
          <button type="submit" class="account-permission-switch"
                  role="switch" aria-checked="{% if cuenta.is_staff %}true{% else %}false{% endif %}"
                  aria-label="Cambiar permisos de {{ cuenta.correo }}"
                  {% if cuenta.pk == current_user.pk %}disabled title="No puedes cambiar tus propios permisos"{% endif %}>
            <span class="account-permission-switch__track" aria-hidden="true">
              <span class="account-permission-switch__thumb"></span>
            </span>
            <span class="account-permission-switch__label">
              {% if cuenta.is_staff %}Hacer usuario común{% else %}Hacer administrador{% endif %}
            </span>
          </button>
        </form>
      </td>
    </tr>
    {% empty %}
    <tr><td colspan="4">No hay cuentas registradas.</td></tr>
    {% endfor %}
  </tbody>
</table>
