{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Salas</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="{% static 'salas/css/salas.css' %}">
</head>
<body>
<main>
    <h1>Salas</h1>
    <p><a class="button-link" href="{% url 'salas:sala_create' %}">Crear sala</a></p>

    <table class="data-table">
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Tipo de sala</th>
            <th>Tipo de sonido</th>
            <th>Capacidad</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        {% for sala in salas %}
        <tr>
            <td>{{ sala.nombre }}</td>
            <td>{{ sala.tipo_sala }}</td>
            <td>{{ sala.tipo_sonido }}</td>
            <td>{{ sala.capacidad }}</td>
            <td>
                <a href="{% url 'salas:sala_detail' sala.pk %}">Ver</a>
                <a href="{% url 'salas:sala_update' sala.pk %}">Editar</a>
                <a href="{% url 'salas:sala_delete' sala.pk %}">Eliminar</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="5">No hay salas registradas.</td></tr>
        {% endfor %}
        </tbody>
    </table>
</main>
</body>
</html>
